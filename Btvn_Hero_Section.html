<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám phá thiên nhiên</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif;">

    <section class="hero" style="
        min-height: 500px;
        padding: 60px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        background-image: url('hero-nature.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-color: #24452d;
        color: rgb(255, 255, 255);
        box-sizing: border-box;
    ">
        <h1 style="
            max-width: 550px;
            font-size: 42px;
            margin: 0 0 16px;
            text-shadow: 1px 2px 5px rgba(0, 0, 0, 0.65);
        ">KHÁM PHÁ THIÊN NHIÊN</h1>

        <p style="
            max-width: 500px;
            font-size: 18px;
            line-height: 1.6;
            text-shadow: 1px 2px 5px rgba(0, 0, 0, 0.7);
        ">Hòa mình vào vẻ đẹp xanh mát và tận hưởng những khoảnh khắc bình yên giữa thiên nhiên.</p>

        <a href="#" style="
            display: inline-block;
            padding: 12px 24px;
            margin-top: 12px;
            background-color: #16a69a;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        ">XEM THÊM</a>
    </section>

</body>
</html>
